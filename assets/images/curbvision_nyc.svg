<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="aiNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glowCV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#bgGradCV)"/>

  <!-- Subtle AI Grid Backdrop -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
  </g>

  <!-- ================= TOP TIER: VIDEO MEASUREMENT PIPELINE ================= -->
  <!-- Stage Tag -->
  <rect x="24" y="16" width="182" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="115" y="29" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4">AI VIDEO MEASUREMENT PIPELINE</text>

  <!-- 1. Roadside Video & Context Input -->
  <g transform="translate(24, 52)">
    <!-- Camera Icon Box -->
    <rect x="0" y="22" width="54" height="58" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="10,42 34,34 38,46 14,54" fill="#38bdf8"/>
    <circle cx="38" cy="40" r="3" fill="#06b6d4"/>
    <path d="M 12 60 L 22 60 L 22 68" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <text x="27" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Roadside</text>
    <text x="27" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Video</text>

    <!-- Bracket to Frames & Context -->
    <path d="M 54 51 L 68 51 M 68 24 L 68 78 M 68 24 L 80 24 M 68 78 L 80 78" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- Video Frames Pill -->
    <rect x="80" y="6" width="92" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="126" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Video Streams</text>
    <text x="126" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" fill="#38bdf8" text-anchor="middle">Temporal Frames</text>

    <!-- Traffic Context Pill -->
    <rect x="80" y="60" width="92" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="126" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Curb &amp; Traffic</text>
    <text x="126" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Spatial Context</text>

    <!-- Outbound Bracket to AI Engine -->
    <path d="M 172 24 L 184 24 M 172 78 L 184 78 M 184 24 L 184 78 M 184 51 L 202 51" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="200,48 206,51 200,54" fill="#38bdf8"/>
  </g>

  <!-- 2. Centerpiece: Computer Vision & VLM Engine + Subtle Indicators -->
  <g transform="translate(232, 16)">
    <!-- Top 3 Indicator Pills -->
    <rect x="0" y="0" width="62" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="31" y="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Vehicle &amp;</text>
    <text x="31" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">Mode Type</text>

    <rect x="68" y="0" width="62" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="99" y="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Loading</text>
    <text x="99" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">Activity</text>

    <rect x="136" y="0" width="62" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="167" y="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Curb</text>
    <text x="167" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">Occupancy</text>

    <!-- Connector Lines Top -->
    <path d="M 31 28 L 31 40 L 167 40 L 167 28 M 99 28 L 99 52" fill="none" stroke="#6366f1" stroke-width="1.4"/>

    <!-- Core AI Engine Box -->
    <rect x="18" y="52" width="162" height="68" rx="10" fill="#1e1b4b" stroke="url(#aiNodeGrad)" stroke-width="2.2" filter="url(#glowCV)"/>

    <!-- Neural Network Graph Icon inside Engine -->
    <g transform="translate(32, 64)">
      <!-- Edges -->
      <line x1="8" y1="8" x2="26" y2="4" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="8" x2="26" y2="22" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="22" x2="26" y2="4" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="22" x2="26" y2="22" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="22" x2="26" y2="38" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="36" x2="26" y2="22" stroke="#c084fc" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="36" x2="26" y2="38" stroke="#c084fc" stroke-width="1.2" opacity="0.8"/>
      <line x1="26" y1="4" x2="44" y2="22" stroke="#818cf8" stroke-width="1.4"/>
      <line x1="26" y1="22" x2="44" y2="22" stroke="#a855f7" stroke-width="1.4"/>
      <line x1="26" y1="38" x2="44" y2="22" stroke="#ec4899" stroke-width="1.4"/>
      <!-- Nodes -->
      <circle cx="8" cy="8" r="3.5" fill="#06b6d4"/>
      <circle cx="8" cy="22" r="3.5" fill="#38bdf8"/>
      <circle cx="8" cy="36" r="3.5" fill="#06b6d4"/>
      <circle cx="26" cy="4" r="3.5" fill="#6366f1"/>
      <circle cx="26" cy="22" r="3.5" fill="#818cf8"/>
      <circle cx="26" cy="38" r="3.5" fill="#6366f1"/>
      <circle cx="44" cy="22" r="4.5" fill="#f43f5e"/>
