    <!-- Connector Lines Bottom -->
    <path d="M 99 120 L 99 132 M 31 144 L 31 132 L 167 132 L 167 144 M 99 132 L 99 144" fill="none" stroke="#6366f1" stroke-width="1.4"/>

    <!-- Bottom 3 Indicator Pills -->
    <rect x="0" y="144" width="62" height="28" rx="5" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="31" y="157" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Dwell</text>
    <text x="31" y="167" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#a5b4fc" text-anchor="middle">Duration</text>

    <rect x="68" y="144" width="62" height="28" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="99" y="157" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Double</text>
    <text x="99" y="167" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#fbbf24" text-anchor="middle">Parking</text>

    <rect x="136" y="144" width="62" height="28" rx="5" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="167" y="157" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Lane</text>
    <text x="167" y="167" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#a5b4fc" text-anchor="middle">Impact</text>
  </g>

  <!-- 3. Structured Activity Data & Pattern Detection -->
  <g transform="translate(414, 66)">
    <line x1="0" y1="36" x2="22" y2="36" stroke="#38bdf8" stroke-width="1.6"/>
    <polygon points="20,33 26,36 20,39" fill="#38bdf8"/>

    <!-- Database Cylinder -->
    <ellipse cx="44" cy="24" rx="14" ry="5" fill="#38bdf8"/>
    <path d="M 30 24 L 30 46 A 14 5 0 0 0 58 46 L 58 24 Z" fill="url(#dbGrad)"/>
    <ellipse cx="44" cy="24" rx="14" ry="5" fill="#7dd3fc"/>
    <path d="M 30 35 A 14 5 0 0 0 58 35" fill="none" stroke="#bae6fd" stroke-width="1"/>
    <text x="44" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8" text-anchor="middle">Structured</text>
    <text x="44" y="73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Curb Data</text>

    <line x1="62" y1="36" x2="78" y2="36" stroke="#38bdf8" stroke-width="1.6"/>
    <polygon points="76,33 82,36 76,39" fill="#38bdf8"/>

    <!-- Pattern Detection Card -->
    <rect x="82" y="8" width="84" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <!-- Mini Bar Chart Icon -->
    <rect x="94" y="34" width="5" height="14" rx="1" fill="#06b6d4"/>
    <rect x="102" y="24" width="5" height="24" rx="1" fill="#38bdf8"/>
    <rect x="110" y="30" width="5" height="18" rx="1" fill="#818cf8"/>
    <text x="140" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Pattern</text>
    <text x="140" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" fill="#38bdf8" text-anchor="middle">Analytics</text>
  </g>

  <!-- ================= DASHED PIPELINE RETURN CONNECTOR ================= -->
  <path d="M 538 134 L 538 202 L 76 202 L 76 218" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,5"/>
  <polygon points="72,216 76,223 80,216" fill="#64748b"/>

