  <!-- Bottom Workflow Badge -->
  <rect x="24" y="300" width="225" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="136" y="313" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="0.4">AGENCY VALIDATION &amp; DECISION WORKFLOW</text>

  <!-- Right Caption -->
  <text x="576" y="314" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="end">CurbVision NYC · CUNY AI &amp; Mobility Lab × NYC DOT</text>
</svg>
