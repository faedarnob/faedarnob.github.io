    <rect x="470" y="0" width="84" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="512" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#ecfdf5" text-anchor="middle">Evidence-Based</text>
    <text x="512" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Curb Policy &amp;</text>
    <text x="512" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#a7f3d0" text-anchor="middle">Investments</text>
