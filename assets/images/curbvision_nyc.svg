    <circle cx="24" cy="20" r="6" fill="#f59e0b" opacity="0.35"/>
    <circle cx="24" cy="20" r="3" fill="#fbbf24"/>
    <circle cx="38" cy="26" r="5" fill="#ef4444" opacity="0.35"/>
    <circle cx="38" cy="26" r="2.5" fill="#f87171"/>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Spatio-Temporal</text>
    <text x="52" y="53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Curb Activity Map</text>

    <line x1="104" y1="31" x2="118" y2="31" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="116,28 122,31 116,34" fill="#10b981"/>

    <!-- Card 2: Human-in-the-Loop Agency Review -->
    <rect x="122" y="0" width="104" height="62" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="156" y="10" width="36" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="163" y="15" width="22" height="10" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="174" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Agency Review</text>
    <text x="174" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#6ee7b7" text-anchor="middle">Human-in-the-Loop</text>

    <line x1="226" y1="31" x2="240" y2="31" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="238,28 244,31 238,34" fill="#10b981"/>

    <!-- Card 3: Validated Measurements -->
    <rect x="244" y="0" width="96" height="62" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="292" cy="20" r="9" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 288 20 L 291 23 L 297 17" fill="none" stroke="#6ee7b7" stroke-width="1.8"/>
    <text x="292" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Validated</text>
    <text x="292" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Indicators</text>

    <line x1="340" y1="31" x2="354" y2="31" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="352,28 358,31 352,34" fill="#10b981"/>

    <!-- Card 4: Planning Insights -->
    <rect x="358" y="0" width="94" height="62" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="405" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">Planning Insights</text>
    <text x="405" y="31" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" fill="#cbd5e1" text-anchor="middle">• Loading Zones</text>
    <text x="405" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" fill="#cbd5e1" text-anchor="middle">• Emerging Modes</text>
    <text x="405" y="53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" fill="#cbd5e1" text-anchor="middle">• Curb Safety</text>

    <line x1="452" y1="31" x2="466" y2="31" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="464,28 470,31 464,34" fill="#10b981"/>

